<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .h { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; }
      .m { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; }
      .b { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0e0e0e"/>
  <rect width="1200" height="8" fill="#4a8cff"/>

  <!-- brand lockup top-left -->
  <g transform="translate(72,70)">
    <rect width="56" height="56" rx="12" fill="#161616" stroke="#262626" stroke-width="1"/>
    <g transform="translate(28,28) scale(0.42) translate(-50,-50)">
      <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#6ea8fe" stroke-width="3"/>
      <line x1="36" y1="40" x2="64" y2="40" stroke="#6ea8fe" stroke-width="2.5" opacity="0.7"/>
      <line x1="36" y1="40" x2="50" y2="68" stroke="#6ea8fe" stroke-width="2.5" opacity="0.7"/>
      <line x1="64" y1="40" x2="50" y2="68" stroke="#6ea8fe" stroke-width="2.5" opacity="0.7"/>
      <circle cx="36" cy="40" r="6" fill="#6ea8fe"/>
      <circle cx="64" cy="40" r="6" fill="#6ea8fe"/>
      <circle cx="50" cy="68" r="6" fill="#6ea8fe"/>
    </g>
    <text x="74" y="37" class="b" font-size="26" fill="#ffffff" letter-spacing="3">AI BOT CODER</text>
  </g>

  <!-- headline -->
  <text x="72" y="270" class="h" font-size="84" fill="#ffffff">Stop doing it</text>
  <text x="72" y="362" class="h" font-size="84" fill="#ffffff">manually. Let <tspan fill="#4a8cff">AI</tspan></text>
  <text x="72" y="454" class="h" font-size="84" fill="#ffffff">run it.</text>

  <!-- subline -->
  <text x="72" y="524" class="m" font-size="31" fill="#b4b4b4">Custom AI automation for small businesses.</text>

  <!-- footer url -->
  <text x="72" y="588" class="b" font-size="26" fill="#4a8cff">aibotcoder.com</text>

  <!-- accent: node mark bottom-right -->
  <g transform="translate(1010,410) scale(1.7) translate(-50,-50)">
    <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#262626" stroke-width="3"/>
    <line x1="36" y1="40" x2="64" y2="40" stroke="#2e2e2e" stroke-width="2.5"/>
    <line x1="36" y1="40" x2="50" y2="68" stroke="#2e2e2e" stroke-width="2.5"/>
    <line x1="64" y1="40" x2="50" y2="68" stroke="#2e2e2e" stroke-width="2.5"/>
    <circle cx="36" cy="40" r="6" fill="#4a8cff"/>
    <circle cx="64" cy="40" r="6" fill="#4a8cff"/>
    <circle cx="50" cy="68" r="6" fill="#51cf66"/>
  </g>
</svg>
