<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .h { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; }
      .m { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; }
      .b { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0e0e0e"/>
  <rect width="1200" height="8" fill="#4a8cff"/>

  <!-- brand lockup top-left -->
  <g transform="translate(72,70)">
    <rect width="56" height="56" rx="12" fill="#161616" stroke="#262626" stroke-width="1"/>
    <g transform="translate(28,28) scale(0.42) translate(-50,-50)">
      <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#6ea8fe" stroke-width="3"/>
      <line x1="36" y1="40" x2="64" y2="40" stroke="#6ea8fe" stroke-width="2.5" opacity="0.7"/>
      <line x1="36" y1="40" x2="50" y2="68" stroke="#6ea8fe" stroke-width="2.5" opacity="0.7"/>
      <line x1="64" y1="40" x2="50" y2="68" stroke="#6ea8fe" stroke-width="2.5" opacity="0.7"/>
      <circle cx="36" cy="40" r="6" fill="#6ea8fe"/>
      <circle cx="64" cy="40" r="6" fill="#6ea8fe"/>
      <circle cx="50" cy="68" r="6" fill="#6ea8fe"/>
    </g>
    <text x="74" y="37" class="b" font-size="26" fill="#ffffff" letter-spacing="3">AI BOT CODER</text>
  </g>

  <!-- headline -->
  <text x="72" y="270" class="h" font-size="82" fill="#ffffff">What are missed</text>
  <text x="72" y="358" class="h" font-size="82" fill="#ffffff">calls <tspan fill="#ff6b6b">costing</tspan> your</text>
  <text x="72" y="446" class="h" font-size="82" fill="#ffffff">business?</text>

  <!-- subline -->
  <text x="72" y="520" class="m" font-size="32" fill="#b4b4b4">Free 30-second calculator — see your number.</text>

  <!-- footer url -->
  <text x="72" y="586" class="b" font-size="26" fill="#4a8cff">aibotcoder.com</text>

  <!-- accent: big pulse dot bottom-right -->
  <circle cx="1070" cy="470" r="120" fill="none" stroke="#262626" stroke-width="2"/>
  <circle cx="1070" cy="470" r="78" fill="none" stroke="#2e2e2e" stroke-width="2"/>
  <circle cx="1070" cy="470" r="14" fill="#51cf66"/>
  <text x="1128" y="300" class="b" font-size="20" fill="#6e6e6e" text-anchor="end" letter-spacing="2">24/7 AI RECEPTIONIST</text>
</svg>
